# Models for thai-llm-bias-probe (REMOTE API ONLY, via OpenRouter's OpenAI-compatible endpoint).
# Fields map 1:1 to ModelCfg in spike.py. Changing anything except rpm / concurrency /
# timeout_s / note changes config_hash, so an existing run id can no longer be resumed.
#
# API-only policy (decision 2026-09-24): spike.py refuses any model without api_key_env
# and any localhost base_url. The earlier Ollama config (qwen3.5:4b, qwen2.5:1.5b) is in
# git history only. All earlier results were wiped on 2026-09-25 (fresh start, no runs).
#
# Key: export OPENROUTER_API_KEY=... (never put the key itself in this file).
#
# Provenance rules for OpenRouter:
#   * OpenRouter routes one model id to many upstream providers with DIFFERENT
#     quantizations. `provider` in extra_body pins one provider + precision and turns
#     fallbacks off, so every sample in a run comes from the same weights. If the pinned
#     provider is down, calls fail (and are retried on re-run) instead of silently switching.
#   * `require_parameters: true` = only route to endpoints that support every parameter we
#     send (seed, temperature, max_tokens).
#   * The raw response JSON (stored in generations.raw_json) includes the provider that
#     actually served the call; check it in the report.
#   * Keep `note` in sync with https://openrouter.ai/api/v1/models/<id>/endpoints
#     (provider list, quantization, price) and write the date you checked it.

# Models ticked by default in the web UI (step 1). Empty = none; the user ticks them by hand.
default_models: []

models:
  # A second, non-Qwen open-weights model for contrast.
  - key: or-gemma4-31b
    provider: openai_compatible
    model: google/gemma-4-31b-it
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 60
    concurrency: 2
    temperature: 0.7
    max_tokens: 2000
    timeout_s: 120
    seed_base: 1000
    extra_body:
      reasoning:
        enabled: false
      provider:
        order: ["novita"]
        quantizations: ["bf16"]
        allow_fallbacks: false
        require_parameters: true
    note: "OpenRouter google/gemma-4-31b-it pinned to Novita bf16; $0.14/M in, $0.40/M out (checked 2026-09-24); thinking OFF"

  # >>> webui-added or-deepseek-v41-flash (2026-09-30)
  - key: "or-deepseek-v41-flash"
    provider: openai_compatible
    model: "deepseek/deepseek-v4.1-flash"
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 60
    concurrency: 2
    temperature: 0.7
    max_tokens: 2000
    timeout_s: 180
    seed_base: 1000
    extra_body: {"reasoning": {"enabled": false}, "provider": {"order": ["novita"], "allow_fallbacks": false, "require_parameters": true, "quantizations": ["fp8"]}}
    note: "OpenRouter deepseek/deepseek-v4.1-flash pinned to Novita fp8; $0.3/M in, $1.2/M out (checked 2026-09-30); thinking OFF"
